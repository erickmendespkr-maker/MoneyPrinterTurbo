name: Refresh vulnerable dependency lock
on:
  workflow_dispatch:
  push:
    branches: [feature/afiliados]
    paths:
      - requirements.txt
      - pyproject.toml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.repository == 'erickmendespkr-maker/MoneyPrinterTurbo' && github.ref == 'refs/heads/feature/afiliados'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/afiliados
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Resolve and update lock
        run: uv lock --upgrade-package python-multipart --upgrade-package litellm --upgrade-package pillow --upgrade-package moviepy
      - name: Commit resolved lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): refresh vulnerable dependency lock"
            git push origin HEAD:feature/afiliados
          fi
