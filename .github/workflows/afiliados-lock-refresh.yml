name: Refresh vulnerable dependency lock
on:
  workflow_dispatch:
  push:
    branches: [feature/afiliados]
    paths:
      - requirements.txt
      - pyproject.toml
      - .github/workflows/afiliados-lock-refresh.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.repository == 'erickmendespkr-maker/MoneyPrinterTurbo' && github.ref == 'refs/heads/feature/afiliados'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/afiliados
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Resolve and update lock
        run: |
          python -m pip install packaging
          uv lock --upgrade-package python-multipart --upgrade-package litellm --upgrade-package pillow --upgrade-package moviepy --upgrade-package anyio --upgrade-package cryptography --upgrade-package fsspec --upgrade-package gitpython --upgrade-package multidict --upgrade-package setuptools --upgrade-package starlette --upgrade-package urllib3
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file /tmp/afiliados-lock-check.txt
          grep -E "^pillow==12\\.3\\.0$" /tmp/afiliados-lock-check.txt
      - name: Check patched dependency versions
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.version import Version
          import re
          requirements = Path("/tmp/afiliados-lock-check.txt").read_text()
          minimums = {"anyio":"4.14.2", "cryptography":"50.0.0", "fsspec":"2026.6.0", "gitpython":"3.1.60", "multidict":"6.9.1", "setuptools":"83.0.0", "starlette":"1.3.1", "urllib3":"2.8.0"}
          for package, minimum in minimums.items():
              matches = re.findall(rf"(?m)^{re.escape(package)}==([^\s;]+)", requirements)
              if not matches or any(Version(v) < Version(minimum) for v in matches):
                  raise SystemExit(f"{package}: expected >= {minimum}, found {matches}")
          PY
      - name: Commit resolved lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): refresh vulnerable dependency lock"
            git push origin HEAD:feature/afiliados
          fi
