name: Afiliados isolated validation
on:
  workflow_dispatch:
  push:
    branches: [feature/afiliados]
    paths:
      - 'app/afiliados/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'test/test_afiliados_*.py'
      - 'requirements.txt'
      - '.github/workflows/afiliados-isolated-validation.yml'
permissions:
  contents: read
concurrency:
  group: afiliados-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimal isolated dependencies
        run: |
          python -m pip install "pytest>=8,<10" "moviepy==2.2.1" "edge-tts==7.3.1"
          python -m pip install --no-deps "pillow==12.3.0"
      - name: Verify patched Pillow installed
        run: python -c "from PIL import __version__; assert __version__ == '12.3.0', __version__"
      - name: Validate syntax
        run: python -m compileall -q app/afiliados webui/pages/90_Afiliados.py test/test_afiliados_core.py test/test_afiliados_render.py test/test_afiliados_voice.py
      - name: Test affiliate modules with patched Pillow despite upstream MoviePy metadata cap
        run: python -m pytest -q test/test_afiliados_core.py test/test_afiliados_render.py test/test_afiliados_voice.py
      - name: Real MP4 encoding smoke test on Linux
        if: runner.os == 'Linux'
        env:
          AFILIADOS_MP4_SMOKE: '1'
        run: python -m pytest -q test/test_afiliados_render.py -k real_mp4_smoke
      # Dependency vulnerability scanning is performed against the complete uv.lock
      # in afiliados-security.yml. The isolated test environment intentionally
      # overrides MoviePy metadata and is not a deployable dependency set.
